# agent-engine on one machine: the control plane's Node host, the LLM gateway
# (its ledger in SQLite on its volume), and an S3-compatible object store. No web
# client (the product's backend is the client, over the app service secret),
# no Litestream replication, no TLS; docker-compose.yml is the fuller stack.
#
#   cp deploy/compose/engine.env.example .env.engine   # then fill in the secrets
#   docker compose -p agent-engine --env-file .env.engine \
#     -f deploy/compose/docker-compose.engine.yml up -d --build --wait
#
# The one file feeds both Compose's own ${...} substitutions and the control
# plane's environment (ENGINE_ENV_FILE names another). A variable exported in
# the shell wins over the file, which is how OPENROUTER_API_KEY can stay out
# of it.
#
# Images and published ports are this stack's own, so it runs beside a
# docker-compose.yml stack: the control plane on ENGINE_APP_PORT (8797), the
# gateway on ENGINE_GATEWAY_PORT (8795; its admin API on the same port, for
# admin-scoped tokens), the object store on ENGINE_OBJECT_STORE_PORT (9007),
# all loopback.

services:
  app:
    build:
      context: ../..
      dockerfile: packages/control-plane/Dockerfile
    image: agent-engine-control-plane:local
    env_file: ${ENGINE_ENV_FILE:-.env.engine}
    # Pinned so the env file cannot move the host off its volume or its port,
    # and so it always reaches this stack's object store.
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      SHUTDOWN_TIMEOUT_MS: "30000"
      # A product's users work alone: each one's sessions are theirs.
      DEFAULT_SESSION_VISIBILITY: private
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-media}
      OBJECT_STORE_REGION: us-east-1
      OBJECT_STORE_ENDPOINT: http://object-store:9000
      OBJECT_STORE_ALLOW_HTTP: "true"
      OBJECT_STORE_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${OBJECT_STORE_ROOT_USER:-objectstoreadmin}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_ROOT_PASSWORD:?OBJECT_STORE_ROOT_PASSWORD must be set; generate one with openssl rand -hex 16}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?GATEWAY_SECRET must be set; generate one with openssl rand -hex 32}
      # OpenRouter key for Jev, which picks the effort of prompts that ask for "auto"; unset, they
      # run at the session's effort.
      JEV_API_KEY: ${JEV_API_KEY:-}
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:${ENGINE_APP_PORT:-8797}:8787"
    volumes:
      - control-plane-data:/data
    depends_on:
      object-store:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

  # SeaweedFS as the S3-compatible store for session media and user files; the
  # same pinned image and startup as docker-compose.yml, with the one bucket.
  object-store:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        WEED_JWT_FILER_SIGNING_KEY="$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        export WEED_JWT_FILER_SIGNING_KEY
        /entrypoint.sh server -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3.ip.bind=0.0.0.0 \
          -master.peers=none -master.telemetry=false -volume.preStopSeconds=1 \
          -filer -s3 -s3.port=9000 -s3.port.iceberg=0 -s3.port.lance=0 &
        server=$$!
        trap 'kill -TERM "$$server"' TERM INT
        until curl -sf -o /dev/null http://localhost:9000/healthz; do
          kill -0 "$$server" 2>/dev/null || exit 1
          sleep 1
        done
        IFS=,
        for bucket in $$S3_BUCKET; do
          echo "s3.bucket.create -name $$bucket" | weed shell -master=127.0.0.1:9333 >/dev/null
        done
        wait "$$server" || wait "$$server"
    stop_grace_period: 20s
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORE_ROOT_USER:-objectstoreadmin}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_ROOT_PASSWORD:?OBJECT_STORE_ROOT_PASSWORD must be set; generate one with openssl rand -hex 16}
      S3_BUCKET: ${OBJECT_STORE_BUCKET:-media}
    # Loopback only: the app reaches it over the compose network.
    ports:
      - "127.0.0.1:${ENGINE_OBJECT_STORE_PORT:-9007}:9000"
    volumes:
      - object-store-data:/data
    # Healthy once S3 answers and every bucket exists, so the app never
    # starts against a store without its bucket. The filer is
    # asked, over loopback, because S3 answers an unsigned request 403 whether
    # or not the bucket exists. Checks run every 2 s until the first passes,
    # then every 30 s; an engine older than Docker 25 skips the 2 s phase.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf -o /dev/null http://localhost:9000/healthz &&
          IFS=, && for bucket in $$S3_BUCKET; do
          curl -sf -o /dev/null "http://localhost:8888/buckets/$$bucket/" || exit 1;
          done
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  # The LLM gateway (packages/gateway, its Node host): the proxy sandboxes call
  # with their per-session token. It refuses a call once the user's or the
  # deployment's budget is spent. Its secret is the control plane's
  # GATEWAY_SECRET, the one both sides sign and verify with.
  gateway:
    build:
      context: ../..
      dockerfile: packages/gateway/Dockerfile
    image: agent-engine-gateway:local
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?GATEWAY_SECRET must be set; generate one with openssl rand -hex 32}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set}
      LLM_BUDGET_USD: ${LLM_BUDGET_USD:-25}
      LLM_USER_BUDGET_USD: ${LLM_USER_BUDGET_USD:-20}
      LLM_USER_BUDGET_PERIOD: ${LLM_USER_BUDGET_PERIOD:-month}
      CACHE_KEEPALIVE: ${CACHE_KEEPALIVE:-}
      CACHE_KEEPALIVE_TOOL_PINGS: ${CACHE_KEEPALIVE_TOOL_PINGS:-}
      CACHE_KEEPALIVE_IDLE_PINGS: ${CACHE_KEEPALIVE_IDLE_PINGS:-}
      LLM_MODEL_MAP: ${LLM_MODEL_MAP:-}
      LLM_FORCE_DEFAULT_MODEL: ${LLM_FORCE_DEFAULT_MODEL:-}
      # Service-wide monthly cap (USD; an admin can override it) and its Lark
      # alert webhook.
      LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-}
      LLM_ALERT_WEBHOOK_URL: ${LLM_ALERT_WEBHOOK_URL:-}
      # Each settled call of a product's user, reported to the product (both or neither).
      LLM_USAGE_REPORT_URL: ${LLM_USAGE_REPORT_URL:-}
      LLM_USAGE_REPORT_TOKEN: ${LLM_USAGE_REPORT_TOKEN:-}
    ports:
      - "127.0.0.1:${ENGINE_GATEWAY_PORT:-8795}:8790"
    volumes:
      - gateway-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8790/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

volumes:
  control-plane-data:
  object-store-data:
  gateway-data:
