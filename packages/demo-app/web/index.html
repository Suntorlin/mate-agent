<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Studio</title>
    <script>
      // Apply the saved or system theme before the first paint (same rule as design/theme.ts).
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("demo-theme");
        } catch (error) {}
        var dark =
          saved === "dark" ||
          (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
