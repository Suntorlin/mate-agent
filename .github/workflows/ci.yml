name: CI (TypeScript)

# The checks a change to Mate Agent has to pass: the control plane (a Cloudflare Worker with Durable
# Objects and D1, and the Node host), the LLM gateway (Worker and Node host), the shared package, the
# skills' scripts. `dev` is the trunk and `main` holds the released versions (docs/RELEASING.md); every
# other branch is a feature branch, tried in a pull request into `dev`. There is no deploy workflow.
#
# There is no path filter on purpose. The checks span the whole tree (the root lint and format cover
# skills/ and deploy/ as well as packages/), and a required check that a path filter
# skips stays pending on the pull request forever.
#
# A push to `dev` does not start this workflow: a pull request into `dev` or `main` does, a push to
# `main` (a release) does, and so does a manual run. Run `npm run verify` before pushing `dev`; it
# runs what this workflow runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_PREFER_OFFLINE: "true"

# A literal name, not github.workflow: when the deploy calls this workflow and ci-python.yml,
# github.workflow is the deploy's name in both, and the two would cancel each other.
concurrency:
  group: ci-typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typescript:
    name: Lint & Format (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The migrations check compares with the branch the pull request targets.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Minimum supported release, matching `engines` in package.json.
          # Every other job runs the version in .nvmrc.
          node-version: "24.0.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check the repository layout
        run: node scripts/check-layout.mjs

      - name: Check the version
        run: node scripts/check-version.mjs

      # The layout and migration checks, the git hooks, the agent guard and `npm run verify`.
      - name: Test the harness
        run: npm run test:harness

      - name: Check the D1 migrations
        run: node scripts/check-migrations.mjs

      - name: Check the D1 migrations against the target branch
        if: github.event_name == 'pull_request'
        run: node scripts/check-migrations.mjs --base origin/${{ github.base_ref }}

      - name: Test complexity reporter
        run: npm run test:lint-complexity

      - name: Check SQL portability
        run: npm run lint:sql-portability

      - name: Test SQL portability check
        run: npm run test:lint-sql-portability

      - name: Test sandbox boundary lint
        run: npm run test:lint-sandbox-boundaries

      - name: Test Owner bootstrap CLI
        run: npm run test:rbac-bootstrap-owner

      - name: Test user merge CLI
        run: npm run test:user-merge-cli

      - name: Test Cloudflare logs CLI
        run: npm run test:cf-logs-cli

      - name: Test Node version workflow contract
        run: npm run test:node-version-workflow-contract

      # The environments' Worker configs (deploy/cloudflare) are copies of each other with their
      # resource names changed; this keeps them the same shape and each to its own names.
      - name: Check the Cloudflare configs agree
        run: node --test deploy/cloudflare/configs.test.mjs

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run Knip (unused code detection)
        run: npm run knip -- --no-exit-code

  typecheck-typescript:
    name: TypeCheck (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: TypeCheck all packages
        run: npm run typecheck

  test-cp-unit:
    name: Test (control-plane unit)
    runs-on: ubuntu-latest
    # The suite itself runs in under a minute; the budget is for a slow
    # dependency install, which has taken over four minutes on a warm cache.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: Run shared tests
        run: npm test -w @open-inspect/shared

      # Runs the node:sqlite lane of the session-core conformance suite
      # (test/conformance). The Durable Object lane of the same suite runs in
      # test-cp-integration; a session repository or migration has to pass both.
      - name: Run control-plane unit tests
        run: npm test -w @open-inspect/control-plane

      - name: Run demo app tests
        run: npm test -w @open-inspect/demo-app

  test-cp-integration:
    name: Test (control-plane integration ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A shard takes two to two and a half minutes on a laptop (workerd and the D1 simulator start for
    # each of ~50 files); a two-core runner takes a few times that, after a dependency install.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      # Runs the Durable Object lane of the session-core conformance suite.
      # The node:sqlite lane of the same suite runs in test-cp-unit.
      - name: Run control-plane integration tests
        run: npm run test:integration -w @open-inspect/control-plane -- --shard=${{ matrix.shard }}

  # The gateway's core and Worker tests run on workerd, its Node host's in Node; the gateway's types
  # are checked with every workspace's in typecheck-typescript. The scripts the sandbox skills run
  # (skills/tests) are in no npm workspace, so no other job reaches them.
  test-gateway-and-skills:
    name: Test (gateway, Docker data plane and skill scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Test the gateway (workerd and Node)
        run: npm test -w @open-inspect/gateway

      - name: Test the Docker data plane
        run: npm test -w @open-inspect/docker-dataplane

      - name: Test the skills' scripts
        run: python3 -m unittest discover -s skills/tests -p 'test_*.py'
