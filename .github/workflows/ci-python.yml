name: CI (Python)

# The Python the sandbox runs (the sandbox runtime, which bridges the agent to the control plane) and
# the sandbox image it is built into. The other providers' packages (modal-infra, e2b-infra,
# daytona-infra) are not checked: the engine's sandboxes are Vercel's.
#
# A push to `dev` does not start this workflow: a pull request or a push to `main` (a release) that
# touches the paths below does, and a manual run (or another workflow calling it) runs it in full,
# since a called workflow ignores the path filters.
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-python.yml"
      - ".nvmrc"
      - "packages/control-plane/src/image-builds/timeouts.ts"
      - "packages/sandbox-runtime/**"
      - "packages/sandbox-images/**"
      - "packages/vercel-infra/**"
      - "packages/shared/src/types/integrations.ts"
      - "ruff.toml"
      - "!**/*.md"
      - "packages/sandbox-runtime/src/**"
      - "packages/sandbox-images/**"
  pull_request:
    branches: [main, dev]
    paths:
      - ".github/workflows/ci-python.yml"
      - ".nvmrc"
      - "packages/control-plane/src/image-builds/timeouts.ts"
      - "packages/sandbox-runtime/**"
      - "packages/sandbox-images/**"
      - "packages/vercel-infra/**"
      - "packages/shared/src/types/integrations.ts"
      - "ruff.toml"
      - "!**/*.md"
      - "packages/sandbox-runtime/src/**"
      - "packages/sandbox-images/**"

permissions:
  contents: read

# A literal name, not github.workflow: see ci.yml.
concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python-sandbox-runtime:
    name: Lint & Format (Python - sandbox-runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/sandbox-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/

  lint-python:
    name: Lint & Format (Python - sandbox-images)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      # Ruff comes with the sandbox runtime's dev dependencies, the same version the job above runs.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/sandbox-runtime[dev]"

      - name: Run Ruff linter
        run: ruff check packages/sandbox-images/

      - name: Run Ruff formatter check
        run: ruff format --check packages/sandbox-images/

  typecheck-python-sandbox-runtime:
    name: TypeCheck (Python - sandbox-runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-python-sandbox-runtime]
    defaults:
      run:
        working-directory: packages/sandbox-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run MyPy
        run: mypy src/
        continue-on-error: true # Allow failures initially as types are added

  test-python-sandbox-runtime:
    name: Test (Python - sandbox-runtime)
    runs-on: ubuntu-latest
    # About 1,650 tests, two and a half minutes on a laptop, plus the install of the agent SDK.
    timeout-minutes: 10
    needs: [lint-python-sandbox-runtime]
    defaults:
      run:
        working-directory: packages/sandbox-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Run Node.js tests
        run: node --test tests/*.test.mjs
